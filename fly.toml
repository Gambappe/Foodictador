# The relay on fly.io (DEPLOY.1).
#
# NOTE THE ABSENCE: there is no [http_service] and no [[services]] block, so this app is
# never given a public IP and nothing on the internet can reach it. Laptops connect over
# fly's private WireGuard network with `fly proxy` — see docs/deploy-flyio.md.
#
# That replaces the Tailscale sidecar in infra/relay/docker-compose.yml. Same property,
# far less setup, and no second account: fly's 6PN private network is already there.
#
# If you ever run `fly ips allocate-v4`, stop — that puts the store of record on the
# public internet, and the operator token travels as a header on every request.

app = "confit-relay"
primary_region = "lhr" # change to the region nearest the venue

[build]
  dockerfile = "infra/relay/Dockerfile"

[env]
  RELAY_PORT = "8787"
  RELAY_DUMP_PATH = "/data/relay.json"

# THE store of record (D-7). A read exists verbatim here and nowhere else — XTrace
# extracts prose rather than storing objects. Destroying this volume destroys every
# confession, permanently.
[mounts]
  source = "relay_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

  # One machine, never zero. There is no [http_service] to hang autostart/autostop off,
  # so nothing suspends the relay between commands — a stopped machine would fail the
  # first request rather than wake it, and that is not something to discover on stage.
  #
  # `processes` is a list of process-group NAMES, not a table. It was `[[vm.processes]]`
  # with `name = "app"`, which flyctl rejects outright: "cannot unmarshal object into Go
  # struct field Compute.vm.processes of type string" — `fly deploy` never starts. There
  # is no [processes] block, so "app" is the implicit default group.
  processes = ["app"]

# The relay is the store of record and has no public address, so nothing external would
# ever notice it wedged. This check is the only thing that turns "the machine is up" into
# "the relay answers": a failing check fails the deploy instead of leaving a dead relay
# reported healthy. `/stats` is the open, coarse view (P0.9), so it needs no token.
[checks.stats]
  type = "http"
  port = 8787
  path = "/stats"
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
